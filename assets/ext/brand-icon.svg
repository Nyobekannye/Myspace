<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Introvert Dreams MAX MODE — Samurai</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="30" y1="20" x2="98" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#f5b400"/>
      <stop offset="1" stop-color="#b8780a"/>
    </linearGradient>
    <linearGradient id="steel" x1="40" y1="40" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="red" x1="64" y1="60" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff453a"/>
      <stop offset="1" stop-color="#a3140c"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="70" r="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff453a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS squircle background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <circle cx="64" cy="72" r="56" fill="url(#glow)"/>

  <!-- Maedate (golden crest) -->
  <path d="M64 14 L70 34 L64 30 L58 34 Z" fill="url(#gold)"/>
  <path d="M40 30 C48 22 56 20 64 22 C72 20 80 22 88 30 C80 28 72 30 64 34 C56 30 48 28 40 30 Z" fill="url(#gold)"/>
  <!-- Kuwagata horns -->
  <path d="M46 34 C34 26 24 18 22 8 C30 14 40 22 50 30 Z" fill="url(#gold)"/>
  <path d="M82 34 C94 26 104 18 106 8 C98 14 88 22 78 30 Z" fill="url(#gold)"/>

  <!-- Kabuto helmet bowl -->
  <path d="M30 56 C30 36 46 28 64 28 C82 28 98 36 98 56 L98 62 L30 62 Z" fill="url(#steel)"/>
  <path d="M30 56 C30 36 46 28 64 28 C82 28 98 36 98 56" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- helmet ridges -->
  <path d="M64 30 V60 M48 34 C46 44 46 52 46 60 M80 34 C82 44 82 52 82 60" stroke="#f5b400" stroke-opacity=".55" stroke-width="1.5" fill="none"/>
  <!-- Mabizashi (visor) -->
  <path d="M24 60 Q64 52 104 60 L100 68 Q64 62 28 68 Z" fill="#26262b" stroke="url(#gold)" stroke-width="2"/>

  <!-- Fukigaeshi (side flaps) -->
  <path d="M24 62 L18 84 L34 82 L34 66 Z" fill="url(#steel)" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M104 62 L110 84 L94 82 L94 66 Z" fill="url(#steel)" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Menpo (red war mask) -->
  <path d="M34 68 L94 68 L92 96 C90 108 78 116 64 116 C50 116 38 108 36 96 Z" fill="url(#red)"/>
  <!-- eyes -->
  <path d="M42 76 L58 80 L56 86 L42 82 Z" fill="#0a0a0c"/>
  <path d="M86 76 L70 80 L72 86 L86 82 Z" fill="#0a0a0c"/>
  <path d="M44 78 L56 81 L55 84 L44 81 Z" fill="#fff" fill-opacity=".85"/>
  <path d="M84 78 L72 81 L73 84 L84 81 Z" fill="#fff" fill-opacity=".85"/>
  <!-- nose ridge -->
  <path d="M64 84 L60 96 L68 96 Z" fill="#7a0e08"/>
  <!-- teeth / grimace -->
  <path d="M46 100 Q64 94 82 100 Q64 108 46 100 Z" fill="#0a0a0c"/>
  <path d="M50 99 L52 104 M56 98 L57 105 M64 97 L64 106 M72 98 L71 105 M78 99 L76 104" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round"/>
  <!-- chin strap knot -->
  <circle cx="64" cy="112" r="2.5" fill="url(#gold)"/>
</svg>
